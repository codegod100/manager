name: Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  NDK_VERSION: "29.0.14206865"
  TARGET_SDK_VERSION: "34"
  CARGO_APK_VERSION: "0.10.0"

jobs:
  build:
    name: Build and publish APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout manager
        uses: actions/checkout@v4

      - name: Checkout vidya
        run: |
          git clone --depth 1 https://tangled.org/nandi.uk/vidya ../vidya

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache cargo-apk
        id: cargo-apk-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-apk
          key: cargo-apk-${{ env.CARGO_APK_VERSION }}

      - name: Install cargo-apk
        if: steps.cargo-apk-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-apk --locked --version "${{ env.CARGO_APK_VERSION }}"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK and platform
        run: |
          yes | sdkmanager --install \
            "ndk;${NDK_VERSION}" \
            "platforms;android-${TARGET_SDK_VERSION}" \
            "build-tools;${TARGET_SDK_VERSION}.0.0"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Configure Android linker
        run: |
          NDK_BIN="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          {
            echo "CC_aarch64_linux_android=${NDK_BIN}/aarch64-linux-android28-clang"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=${NDK_BIN}/aarch64-linux-android28-clang"
            echo "AR_aarch64_linux_android=${NDK_BIN}/llvm-ar"
          } >> "$GITHUB_ENV"

      - name: Restore release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [[ -n "${ANDROID_KEYSTORE_BASE64:-}" ]]; then
            mkdir -p "$RUNNER_TEMP/keystore"
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore/manager-release.keystore"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/keystore/manager-release.keystore" >> "$GITHUB_ENV"
            if [[ -n "${ANDROID_KEYSTORE_PASSWORD:-}" ]]; then
              echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            fi
          fi

      - name: Build release APK
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          apk="$(./scripts/build-apk.sh --release)"
          mkdir -p dist
          cp "$apk" "dist/manager-aarch64-release.apk"
          ls -lh dist/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: manager-aarch64-release
          path: dist/manager-aarch64-release.apk
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/manager-aarch64-release.apk
          generate_release_notes: true
