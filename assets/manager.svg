<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="Agent Manager">
  <!-- Rounded app tile — Vidya charcoal -->
  <rect x="4" y="4" width="120" height="120" rx="28" ry="28" fill="#2e2e2e"/>
  <rect x="4" y="4" width="120" height="120" rx="28" ry="28" fill="none" stroke="#454545" stroke-width="2"/>

  <!-- Session tab bar -->
  <rect x="22" y="28" width="84" height="14" rx="4" fill="#3d3d3d"/>
  <rect x="26" y="31" width="28" height="8" rx="2" fill="#3584e4"/>
  <rect x="58" y="31" width="20" height="8" rx="2" fill="#555555"/>
  <rect x="82" y="31" width="20" height="8" rx="2" fill="#555555"/>

  <!-- Terminal pane -->
  <rect x="22" y="46" width="84" height="54" rx="6" fill="#1c1c1c" stroke="#454545" stroke-width="1.5"/>

  <!-- Prompt lines -->
  <circle cx="32" cy="58" r="2.5" fill="#3584e4"/>
  <rect x="40" y="56" width="42" height="4" rx="2" fill="#6c6c6c"/>
  <rect x="32" y="68" width="56" height="3.5" rx="1.75" fill="#454545"/>
  <rect x="32" y="78" width="38" height="3.5" rx="1.75" fill="#454545"/>
  <rect x="32" y="88" width="48" height="3.5" rx="1.75" fill="#555555"/>

  <!-- Multi-instance dots -->
  <circle cx="48" cy="112" r="3.5" fill="#3584e4"/>
  <circle cx="64" cy="112" r="3.5" fill="#6c6c6c"/>
  <circle cx="80" cy="112" r="3.5" fill="#6c6c6c"/>
</svg>
