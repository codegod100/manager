[package]
name = "manager-android"
version = "0.1.0"
edition = "2021"
description = "Agent Manager — Android NativeActivity shell (vidya)"
license = "MIT"
publish = false

# Own workspace root so cargo-apk builds in-tree.
[workspace]

[lib]
name = "manager_android"
path = "src/lib.rs"
# lib-only: cargo-apk panics if this package also has [[bin]] targets
crate-type = ["cdylib", "rlib"]

[dependencies]
vidya = { path = "../../vidya" }
# Shared glow + fonts only — do NOT enable wayland/x11 here (feature unification
# would pull them into the Android build and can make the activity exit immediately).
eframe = { version = "0.31", default-features = false, features = [
    "default_fonts",
    "glow",
] }
egui = "0.31"
log = "0.4"

[target.'cfg(not(target_os = "android"))'.dependencies]
eframe = { version = "0.31", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }

[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.31", default-features = false, features = [
    "default_fonts",
    "glow",
    "android-native-activity",
] }
android_logger = "0.14"
winit = { version = "0.30", default-features = false, features = ["android-native-activity"] }

[package.metadata.android]
package = "uk.nandi.manager"
apk_name = "manager"
# aarch64 = phones; x86_64 = Waydroid / emulators
build_targets = ["aarch64-linux-android", "x86_64-linux-android"]
resources = "res"

[package.metadata.android.sdk]
min_sdk_version = 28
target_sdk_version = 34

[package.metadata.android.application]
label = "Agent Manager"
orientations = ["Portrait", "Landscape"]
theme = "@android:style/Theme.DeviceDefault.NoActionBar"
icon = "@mipmap/ic_launcher"
